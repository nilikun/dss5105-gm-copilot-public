    subject: KNITTING
    field: mean_output
    expected_value: 932.5
    unit: pieces/working day
    dates_or_window: 2026-03-25 to 2026-03-31
    calculation: Mean of Monday-Saturday rows; Sunday 29 March is closed
    tolerance: 0
    value_type: number
    pattern: (?<![\d.])(?P<value>932\.50*)(?!\d)
  - criterion_id: scrap_unavailable
    subject: KNITTING
    field: scrap
