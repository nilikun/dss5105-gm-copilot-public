<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 572" width="780" height="572"><defs></defs><rect width="780" height="572" fill="#FFFFFF"/><rect x="12.0" y="18.0" width="84.0" height="26.0" rx="3" fill="#E0F2EC" stroke="#009E73" stroke-width="1.2"/><text x="54.0" y="36.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">Question</text><text x="110.0" y="36.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333333" text-anchor="start" xml:space="preserve">Was assembly's output yesterday normal?</text><line x1="12" y1="54" x2="768" y2="54" stroke="#E6E6E6" stroke-width="1.2"/><rect x="12.0" y="66.0" width="84.0" height="26.0" rx="3" fill="#FBEAE0" stroke="#D55E00" stroke-width="1.2"/><text x="54.0" y="84.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">Thought</text><text x="110.0" y="84.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start" font-style="italic" xml:space="preserve">“Yesterday” is relative: resolve it before querying.</text><rect x="12.0" y="110.0" width="84.0" height="26.0" rx="3" fill="#E3EEF7" stroke="#0072B2" stroke-width="1.2"/><text x="54.0" y="128.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">Act 1</text><text x="110.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="400" fill="#333333" text-anchor="start" xml:space="preserve">resolve_time(expression="yesterday")</text><rect x="12.0" y="153.0" width="84.0" height="26.0" rx="3" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="1.2"/><text x="54.0" y="171.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">Obs 1</tex